name: proxmox

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: proxmox

jobs:
  # No Proxmox needed: formats, validates and plans the OpenTofu module
  # (a plan for new resources doesn't contact the API), and builds the system.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          extra_nix_config: experimental-features = nix-command flakes
      - name: OpenTofu fmt, validate, plan
        env:
          PROXMOX_VE_ENDPOINT: https://pve.invalid:8006/
          PROXMOX_VE_API_TOKEN: ci@pve!plan=00000000-0000-0000-0000-000000000000
          TF_VAR_state_passphrase: plan-only-throwaway-passphrase
        run: |
          nix develop -c bash -ec '
            cd tofu
            tofu fmt -check -diff
            tofu init -backend=false -input=false
            tofu validate
            tofu plan -input=false -var-file=terraform.tfvars.example
          '
      - name: Build dar-pve and its disko script
        run: nix build .#nixosConfigurations.dar-pve.config.system.build.toplevel .#nixosConfigurations.dar-pve.config.system.build.diskoScript

  # Boots dar-pve in a NixOS test VM: secret decrypted with the host key.
  vm-test:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: true
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build -L .#checks.x86_64-linux.dar-pve

  # The whole chain on a Debian skeleton in QEMU/KVM: nixos-anywhere with the
  # pre-generated host key, reboot, then checks over SSH.
  e2e:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: true
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix develop .#e2e -c ci/e2e-qemu.sh
